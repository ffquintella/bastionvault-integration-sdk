name: .NET quality gates

on:
  push:
    branches: [main]
    paths:
      - "dotnet/**"
      - "specifications/fixtures/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    paths:
      - "dotnet/**"
      - "specifications/fixtures/**"
      - ".github/workflows/dotnet.yml"

permissions:
  contents: read

jobs:
  gates:
    name: Build, test, coverage, lint, audit, API diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # CNF-020 (warnings as errors) and CNF-023 (analyzer/style lint via
      # EnforceCodeStyleInBuild + AnalysisLevel=latest-all) are enforced as compiler
      # diagnostics inside a single `dotnet build` for this SDK. CNF-027 (public API
      # diff) is NOT enforced here: Microsoft.CodeAnalysis.PublicApiAnalyzers
      # (RS0016/RS0017) was found in review (D-M1b-19) to be silently inert under
      # AnalysisLevel=latest-all — `NetAnalyzers.props` reassigns
      # $(CodeAnalysisRuleIds), dropping the RS00xx set the analyzer relies on, so a
      # brand-new undeclared public member built with 0 warnings and 0 errors. The
      # package was removed. CNF-027 is proven instead by
      # dotnet/BastionVault.IntegrationSdk.Tests/ApiSurface/PublicApiSurfaceTests.cs, a
      # reflection-based diff against the committed PublicApiSurface.txt, which runs as
      # part of the `dotnet test` step below — the same category of check Rust
      # (`cargo public-api`) and Python (`tests/test_api_surface.py`) already run.
      - name: Build — warnings as errors, style/analyzer lint (CNF-020, CNF-023)
        run: dotnet build dotnet/BastionVault.IntegrationSdk.sln

      # CNF-021 tests, CNF-022/CNF-010 coverage floor, CNF-027 public API diff
      # (ApiSurface/PublicApiSurfaceTests.cs). coverlet.msbuild is the only coverage
      # mechanism wired into the test csproj (see its inline comment and
      # decisions/0001-m0-harness.md D-M0-12a follow-up) — coverlet.collector was tried
      # and rejected because it did not fail the build on a seeded uncovered branch.
      - name: Test, coverage, public API diff (CNF-021, CNF-022, CNF-010, CNF-027)
        run: dotnet test dotnet/BastionVault.IntegrationSdk.Tests/BastionVault.IntegrationSdk.Tests.csproj

      # CNF-013, TST-031: publish both the human-readable HTML report and the
      # machine-readable Cobertura summary.
      - name: Upload coverage HTML report (CNF-013, TST-031)
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage-html
          path: dotnet/BastionVault.IntegrationSdk.Tests/coverage/html

      - name: Upload coverage Cobertura summary (CNF-013, TST-031)
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage-cobertura
          path: dotnet/BastionVault.IntegrationSdk.Tests/coverage/coverage.cobertura.xml

      # DOC-003, DOC-022 (DR-0018 D-M11-3, D-M11-25 g2): every documented sample is an
      # xunit test method, compiled by the build step above and executed here. Without
      # this step DOC-003's "executed" limb is only true locally, never in CI.
      - name: Documentation samples compile and execute (DOC-003, DOC-022)
        run: dotnet test dotnet/BastionVault.IntegrationSdk.DocsSamples/BastionVault.IntegrationSdk.DocsSamples.csproj

      # CNF-024: dependency audit.
      - name: Dependency audit (CNF-024)
        run: dotnet list dotnet/BastionVault.IntegrationSdk/BastionVault.IntegrationSdk.csproj package --vulnerable
