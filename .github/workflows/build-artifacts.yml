name: Build SDK Artifacts

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: Build .NET package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack .NET SDK
        run: dotnet pack ./dotnet/BastionVault.IntegrationSdk/BastionVault.IntegrationSdk.csproj -p:ContinuousIntegrationBuild=true
      - name: Upload .NET artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-artifacts
          path: dotnet/BastionVault.IntegrationSdk/bin/Release/*.nupkg

  rust:
    name: Build Rust crate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Rust lockfile
        run: cargo generate-lockfile --manifest-path ./rust/bastionvault-integration-sdk/Cargo.toml
      - name: Package Rust SDK
        run: cargo package --manifest-path ./rust/bastionvault-integration-sdk/Cargo.toml
      - name: Upload Rust artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-artifacts
          path: rust/bastionvault-integration-sdk/target/package/*.crate

  python:
    name: Build Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
        working-directory: ./python
      - name: Build Python artifacts
        run: python -m build --outdir ../artifacts/python
        working-directory: ./python
      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-artifacts
          path: artifacts/python/*

  agent-docs:
    name: Validate agent orchestration docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate agents.md, claude.md and skills routing files
        run: python scripts/validate-agent-docs.py
