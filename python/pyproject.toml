[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bastionvault-integration-sdk"
version = "0.3.0"
description = "BastionVault Integration SDK base Python package"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "BastionVault" }]
dependencies = [
    "cryptography>=41.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage>=7.6",
    "jsonschema>=4.17",
    "types-jsonschema>=4.17",
    "mypy>=1.8",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: starts a real in-process HTTPS listener",
]
addopts = [
    "--cov=bastionvault_integration_sdk",
    "--cov-branch",
    "--cov-fail-under=95",
    "--cov-report=term-missing",
    "--cov-report=html:coverage/html",
    "--cov-report=xml:coverage.xml",
]

[tool.coverage.run]
branch = true
source = ["src/bastionvault_integration_sdk"]

[tool.coverage.report]
show_missing = true
skip_empty = false

[tool.mypy]
files = ["src", "tests"]
python_version = "3.10"
strict = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["numpy"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true
ignore_errors = true

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
