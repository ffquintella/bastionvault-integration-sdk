[package]
name = "bastionvault-integration-sdk"
version = "0.4.0"
edition = "2024"
description = "BastionVault Integration SDK base Rust crate"
license = "MIT"
repository = "https://github.com/ffquintella/bastionvault-integration-sdk"

[dependencies]
base64 = "=0.22.1"
url = "=2.5.8"
bytes = "=1.12.1"
hyper-util = { version = "=0.1.20", features = ["tokio", "client", "client-legacy", "http1"] }
rustls = { version = "=0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.4"
serde_json = "=1.0.149"
tokio = { version = "=1.53.0", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time", "io-util"] }
tokio-rustls = "=0.26.4"
tower-service = "=0.3.3"
hyper = { version = "=1.9.0", features = ["http1", "client"] }
http-body-util = "=0.1.3"

[dev-dependencies]
rcgen = "=0.14.8"
serde = { version = "=1.0.228", features = ["derive"] }
tempfile = "=3.27.0"
hyper = { version = "=1.9.0", features = ["http1", "server", "client"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
