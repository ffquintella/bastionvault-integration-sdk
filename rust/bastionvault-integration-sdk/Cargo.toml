[package]
name = "bastionvault-integration-sdk"
version = "0.2.1"
edition = "2024"
description = "BastionVault Integration SDK base Rust crate"
license = "MIT"
repository = "https://github.com/ffquintella/bastionvault-integration-sdk"

[dependencies]

[dev-dependencies]
bytes = "=1.12.1"
hyper-util = { version = "=0.1.20", features = ["tokio"] }
rcgen = "=0.14.8"
rustls = { version = "=0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tempfile = "=3.27.0"
tokio = { version = "=1.53.0", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util"] }
tokio-rustls = "=0.26.4"
hyper = { version = "=1.9.0", features = ["http1", "server"] }
http-body-util = "=0.1.3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
